name: Thử voice 11labs

on:
  workflow_dispatch:
    inputs:
      text:
        description: Câu tiếng Đức để đọc thử
        default: "Guten Abend. Der Bundestag hat heute ein neues Gesetz beschlossen. Was ändert sich jetzt für Sie?"
        required: true
      voice:
        description: voice_id (để trống = giọng mặc định của kênh, ghi trong prompts/news_voice.json)
        default: ""
        required: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04   # chốt phiên bản: ubuntu-latest đang chuyển sang 26
    timeout-minutes: 20
    env:
      VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
      VN11_VOICE_ID: ${{ secrets.VN11_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Số dư
        run: python3 scripts/vn11.py balance
      - name: Danh sách giọng (Đức + clone)
        run: |
          python3 scripts/vn11.py voices --language German --out voices.md
          cat voices.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tạo giọng thử
        env:   # through the environment, never pasted into the script: quotes, $ or ` in the text stay text
          TEXT: ${{ inputs.text }}
          VOICE: ${{ inputs.voice }}
        run: |
          printf '%s' "$TEXT" > /tmp/text.txt
          # empty = the channel voice (prompts/news_voice.json "default"), the one the videos use
          [ -n "$VOICE" ] || VOICE=$(python3 -c "import json; print(json.load(open('prompts/news_voice.json', encoding='utf-8')).get('default') or '')")
          echo "voice: ${VOICE:-(11labs default)}"
          python3 scripts/vn11.py tts --text-file /tmp/text.txt --out out --voice "$VOICE"
          U=$(cat out/usage.json | tr -d '\n')
          echo "::notice title=voice usage::$U"
          echo "### Kết quả" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; cat out/usage.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test
          path: |
            out/
            voices.md
      - name: Đưa kết quả lên nhánh renders
        if: success()
        run: |
          mkdir -p /tmp/pub && cp out/voice.mp3 /tmp/pub/voice-test.mp3 && cp out/usage.json /tmp/pub/voice-test-usage.json && cp voices.md /tmp/pub/voices.md
          [ -f out/voice.srt ] && cp out/voice.srt /tmp/pub/voice-test.srt || true
          rm -rf voices.md out   # đã chép sang /tmp/pub; để lại thì bị đưa nhầm lên nhánh renders
          if git fetch origin renders --depth 1; then git checkout -B renders origin/renders
          else git checkout --orphan renders && { git rm -rf -q . || true; } && git clean -fdq; fi   # repo mới: chưa có nhánh renders
          cp /tmp/pub/* .
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -q -m "Voice test $GITHUB_RUN_ID" || true
          git push origin renders
