name: Video tin tức (ảnh thật)

# One issue "[Tin tức] …" = one vertical news short made from real free-to-use pictures, a German
# voice and subtitles timed to it. Owner opens the issue → Claude writes news/<N>/script.json → this workflow
# reads the voice (11labs, one job per line), checks it with Whisper and searches pictures → Claude chooses the
# pictures (news/<N>/picks.json) → this workflow renders → Claude checks every shot → done. An owner comment
# → Claude fixes. Claude's side: AGENT_NEWS.md. Files: renders branch, folder news/<N>/.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['news/**']
  workflow_dispatch:
    inputs:
      issue:
        description: Số phiếu
        required: true
      steps:
        description: 'Bước: prepare (giọng + ảnh), search (tìm thêm ảnh), render (dựng) — cách nhau bằng dấu cách'
        default: render

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1) The owner (or a collaborator) opens a [Tin tức] issue → wait for Claude's plan, wake Claude now
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Tin tức]')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận phiếu
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
        run: |
          gh issue edit "$N" --add-label news,news-plan
          gh issue comment "$N" --body "🤖 Đã nhận kịch bản. Claude sẽ chia câu và chọn từ khóa tìm ảnh (dịch sang tiếng Đức nếu cần), máy tạo giọng đọc và tìm ảnh, Claude chọn ảnh, máy dựng video, Claude kiểm tra lại từng cảnh. Mỗi bước xong sẽ báo ở đây."
      - name: Gọi Claude
        env: { CLAUDE_TASK_URL: '${{ secrets.CLAUDE_TASK_URL }}', CLAUDE_TASK_TOKEN: '${{ secrets.CLAUDE_TASK_TOKEN }}' }
        run: bash scripts/wake_claude.sh "Phiếu tin tức (Đức) mới số ${{ github.event.issue.number }}."

  # 2) The owner comments on a news issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'news')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận yêu cầu sửa
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
        run: |
          gh issue edit "$N" --add-label news-fix --remove-label news-done || true
          gh issue comment "$N" --body "🤖 Đã nhận yêu cầu. Claude sẽ sửa và máy dựng lại."
      - name: Gọi Claude
        env: { CLAUDE_TASK_URL: '${{ secrets.CLAUDE_TASK_URL }}', CLAUDE_TASK_TOKEN: '${{ secrets.CLAUDE_TASK_TOKEN }}' }
        run: bash scripts/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu tin tức (Đức) số ${{ github.event.issue.number }}."

  # 3) Claude pushed news/<N>/… (or a manual run) → voice + pictures, or the video
  work:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # no concurrency group: a pending run would be dropped when a third push arrives
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
      FONTSOURCE: /tmp/fontsource
      PYTHONUNBUFFERED: '1'
      BEFORE: ${{ github.event.before }}
      IN_ISSUE: ${{ inputs.issue }}
      IN_STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Việc cần làm
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$IN_ISSUE" in ''|*[!0-9]*) echo "::error::số phiếu không hợp lệ"; exit 1;; esac
            S=""; for s in $IN_STEPS; do case "$s" in prepare|search|render) S="$S $s";; esac; done
            echo "$IN_ISSUE$S" > /tmp/todo.txt
          else
            # files changed by this push (only the last commit's when the old head cannot be fetched); NUL-separated
            # and unquoted, so names with spaces or accents survive
            { git fetch -q --depth 1 origin "$BEFORE" 2>/dev/null && git -c core.quotePath=false diff -z --name-only "$BEFORE" HEAD -- news/ > /tmp/files.txt; } \
              || git -c core.quotePath=false show -z --name-only --format= HEAD -- news/ > /tmp/files.txt
            python3 -c '
          import re, sys, collections
          todo = collections.OrderedDict()
          for f in sys.stdin.buffer.read().decode("utf-8", "replace").split("\0"):
              m = re.match(r"news/(\d+)/(.+)$", f.strip("\n"))
              if not m: continue
              n, rest = m.groups()
              s = todo.setdefault(n, [])
              step = "prepare" if rest == "script.json" else "search" if re.match(r"search-\w+\.json$", rest) else "render" if rest == "picks.json" or rest.startswith("own/") else None
              if step and step not in s: s.append(step)
          order = ["prepare", "search", "render"]
          print("\n".join(n + " " + " ".join(sorted(s, key=order.index)) for n, s in todo.items() if s))' < /tmp/files.txt > /tmp/todo.txt
          fi
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] && echo "TODO=1" >> "$GITHUB_ENV" || echo "Không có việc."
      - name: Cài công cụ
        if: env.TODO == '1'
        run: |
          # pinned to the versions tested together (PyAV 19 breaks faster-whisper 1.2: "metadata_errors")
          pip install -q numpy scipy pillow num2words==0.5.14 faster-whisper==1.1.1 av==13.1.0 imageio-ffmpeg==0.8.1
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          bash scripts/news/get_fonts.sh "$FONTSOURCE"
      - name: Chạy
        if: env.TODO == '1'
        run: |
          FAIL=0
          : > /tmp/handled.txt
          while read -r N STEPS; do
            echo "::group::phiếu #$N: $STEPS"
            # < /dev/null: nothing inside run.py may read the rest of the to-do list from the loop's stdin
            if ! python3 scripts/news/run.py "$N" $STEPS < /dev/null; then
              FAIL=1
              gh issue edit "$N" --add-label news-failed --remove-label news-voice --remove-label news-render < /dev/null || true
              gh issue comment "$N" --body "🤖 Máy gặp lỗi ở bước \`$STEPS\` — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Claude sẽ xem và sửa." < /dev/null || true
              bash scripts/wake_claude.sh "Phiếu tin tức (Đức) số $N bị lỗi ở bước $STEPS." < /dev/null || true
            fi
            echo "$N" >> /tmp/handled.txt
            echo "::endgroup::"
          done < /tmp/todo.txt
          exit $FAIL
      # The job stopped outside run.py (tools failed to install, time limit, cancelled): issues the loop did not reach
      # would keep news-voice/news-render forever, so they are marked failed here.
      - name: Báo lỗi cho phiếu chưa chạy
        if: (failure() || cancelled()) && env.TODO == '1'
        run: |
          touch /tmp/handled.txt
          while read -r N STEPS; do
            [ -n "$N" ] || continue
            grep -qx "$N" /tmp/handled.txt && continue
            gh issue edit "$N" --add-label news-failed < /dev/null || true
            gh issue edit "$N" --remove-label news-voice --remove-label news-render < /dev/null || true
            gh issue comment "$N" --body "🤖 Máy dừng giữa chừng trước khi làm xong bước \`$STEPS\` (lỗi cài đặt, quá giờ hoặc bị hủy) — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Claude sẽ xem và chạy lại." < /dev/null || true
            bash scripts/wake_claude.sh "Phiếu tin tức (Đức) số $N: máy dừng giữa chừng ở bước $STEPS." < /dev/null || true
          done < /tmp/todo.txt
          true
